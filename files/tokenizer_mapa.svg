<svg width="620" height="300" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="620" height="300" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#333">O tokenizer troca cada caractere por um número</text>

  <!-- caractere -->
  <rect x="60" y="120" width="110" height="60" rx="10" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.5"/>
  <text x="115" y="145" text-anchor="middle" font-size="14" fill="#333">o caractere</text>
  <text x="115" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#3B8BD4">'a'</text>

  <line x1="172" y1="150" x2="228" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw2)"/>
  <text x="200" y="138" text-anchor="middle" font-size="12" fill="#777">consulta</text>

  <!-- tabela -->
  <rect x="235" y="70" width="200" height="160" rx="10" fill="#f4f2fc" stroke="#534AB7" stroke-width="1.5"/>
  <text x="335" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#534AB7">tabela (vocabulário)</text>
  <text x="255" y="122" font-size="13" fill="#333">' ' → 1</text>
  <text x="255" y="146" font-size="13" fill="#333">'&lt;' → 7</text>
  <rect x="248" y="156" width="174" height="24" rx="5" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.2"/>
  <text x="255" y="173" font-size="13" font-weight="700" fill="#B23A2E">'a' → 33</text>
  <text x="255" y="200" font-size="13" fill="#333">'b' → 34</text>
  <text x="335" y="222" text-anchor="middle" font-size="11" fill="#777">... 59 caracteres</text>

  <line x1="437" y1="168" x2="493" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw2)"/>

  <!-- número -->
  <rect x="500" y="138" width="90" height="60" rx="10" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="545" y="163" text-anchor="middle" font-size="14" fill="#333">número</text>
  <text x="545" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#0F6E56">33</text>

  <text x="310" y="270" text-anchor="middle" font-size="12" fill="#777">E o caminho de volta (33 → 'a') reconstrói o texto. É como um dicionário de mão dupla.</text>
</svg>
