<svg width="620" height="330" viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arwE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="620" height="330" fill="#ffffff"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#333">O número é o endereço da linha; a linha é o vetor</text>

  <!-- número -->
  <rect x="30" y="140" width="80" height="50" rx="10" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.5"/>
  <text x="70" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#3B8BD4">2</text>
  <line x1="112" y1="165" x2="158" y2="165" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arwE)"/>
  <text x="135" y="153" text-anchor="middle" font-size="11" fill="#777">busca</text>

  <!-- tabela -->
  <rect x="165" y="70" width="270" height="185" rx="10" fill="#f4f2fc" stroke="#534AB7" stroke-width="1.5"/>
  <text x="300" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#534AB7">tabela de embeddings (3 × 4)</text>
  <text x="182" y="122" font-size="13" fill="#333">linha 0:  [ 0.5  -0.2  0.8  0.1 ]</text>
  <text x="182" y="150" font-size="13" fill="#333">linha 1:  [ -0.7  0.3  0.4  -0.9 ]</text>
  <rect x="176" y="162" width="248" height="26" rx="5" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.2"/>
  <text x="182" y="180" font-size="13" font-weight="700" fill="#B23A2E">linha 2:  [ 0.2  0.6  -0.1  0.5 ]</text>
  <text x="182" y="210" font-size="12" fill="#777">(uma linha por caractere)</text>
  <text x="300" y="238" text-anchor="middle" font-size="11" fill="#777">começa aleatória; o treino ajusta</text>

  <line x1="437" y1="175" x2="483" y2="175" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arwE)"/>

  <!-- vetor -->
  <rect x="490" y="145" width="110" height="60" rx="10" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.5"/>
  <text x="545" y="168" text-anchor="middle" font-size="12" fill="#333">vetor</text>
  <text x="545" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#B23A2E">[0.2 0.6 -0.1 0.5]</text>

  <text x="310" y="300" text-anchor="middle" font-size="12" fill="#777">Consultar o embedding = pegar a linha cujo número o tokenizer deu. É só isso.</text>
</svg>
