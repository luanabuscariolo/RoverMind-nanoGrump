<svg width="620" height="300" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arwP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="620" height="300" fill="#ffffff"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Cada caractere carrega: quem ele é + onde ele está</text>

  <!-- caractere -->
  <rect x="40" y="70" width="240" height="56" rx="10" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="60" y="92" font-size="13" font-weight="700" fill="#0F6E56">quem ele é (o caractere 'c')</text>
  <text x="60" y="114" font-size="14" fill="#333">[ 0.2   0.6   -0.1   0.5 ]</text>

  <text x="310" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#5F5E5A">+</text>

  <!-- posicao -->
  <rect x="40" y="140" width="240" height="56" rx="10" fill="#f4f2fc" stroke="#534AB7" stroke-width="1.5"/>
  <text x="60" y="162" font-size="13" font-weight="700" fill="#534AB7">onde ele está (posição 0)</text>
  <text x="60" y="184" font-size="14" fill="#333">[ 0.1   0.1   0.0   -0.1 ]</text>

  <line x1="290" y1="150" x2="345" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arwP)"/>
  <text x="317" y="138" text-anchor="middle" font-size="11" fill="#777">soma</text>

  <!-- resultado -->
  <rect x="355" y="112" width="235" height="76" rx="10" fill="#fbe6e2" stroke="#B23A2E" stroke-width="1.5"/>
  <text x="375" y="136" font-size="13" font-weight="700" fill="#B23A2E">vetor final de 'c' na posição 0</text>
  <text x="375" y="160" font-size="14" fill="#333">[ 0.3   0.7   -0.1   0.4 ]</text>
  <text x="375" y="180" font-size="11" fill="#777">identidade + posição, juntas</text>

  <text x="310" y="240" text-anchor="middle" font-size="12" fill="#555">A soma é elemento a elemento:  0.2+0.1=0.3   0.6+0.1=0.7   -0.1+0.0=-0.1   0.5+(-0.1)=0.4</text>
  <text x="310" y="266" text-anchor="middle" font-size="12" fill="#777">Assim o modelo distingue a ordem: a mesma letra em outra posição vira outro vetor.</text>
</svg>
