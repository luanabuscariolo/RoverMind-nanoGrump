<svg width="620" height="440" viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#ffffff"/>

  <rect x="120" y="24" width="380" height="52" rx="10" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="310" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#0F6E56">1. Tokenizer</text>
  <text x="310" y="64" text-anchor="middle" font-size="13" fill="#333">transformar texto em números</text>
  <line x1="310" y1="76" x2="310" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="120" y="98" width="380" height="52" rx="10" fill="#eeecfb" stroke="#534AB7" stroke-width="1.5"/>
  <text x="310" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#534AB7">2. Modelo (mini-GPT)</text>
  <text x="310" y="138" text-anchor="middle" font-size="13" fill="#333">embeddings + atenção + FFN</text>
  <line x1="310" y1="150" x2="310" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="120" y="172" width="380" height="52" rx="10" fill="#eeecfb" stroke="#534AB7" stroke-width="1.5"/>
  <text x="310" y="193" text-anchor="middle" font-size="16" font-weight="700" fill="#534AB7">3. Treino</text>
  <text x="310" y="212" text-anchor="middle" font-size="13" fill="#333">o modelo aprende, na GPU</text>
  <line x1="310" y1="224" x2="310" y2="244" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="120" y="246" width="380" height="52" rx="10" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="310" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#0F6E56">4. Gerar texto</text>
  <text x="310" y="286" text-anchor="middle" font-size="13" fill="#333">ver o robô "falar" no PC</text>
  <line x1="310" y1="298" x2="310" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="120" y="320" width="380" height="52" rx="10" fill="#fdeee0" stroke="#BA7517" stroke-width="1.5"/>
  <text x="310" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#BA7517">5. Exportar e embarcar</text>
  <text x="310" y="360" text-anchor="middle" font-size="13" fill="#333">levar o cérebro para o ESP32-S3</text>

  <text x="310" y="404" text-anchor="middle" font-size="12" fill="#777">Cada etapa é testada sozinha antes de seguir para a próxima.</text>
</svg>
