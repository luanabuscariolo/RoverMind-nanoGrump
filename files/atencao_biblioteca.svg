<svg width="620" height="360" viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9a9a95" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Cada token compara seu Query com a Key de cada outro token</text>

  <!-- leitor -->
  <rect x="20" y="150" width="170" height="90" rx="10" fill="#e6f0fa" stroke="#3B8BD4" stroke-width="1.5"/>
  <text x="105" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#3B8BD4">Token leitor</text>
  <text x="105" y="198" text-anchor="middle" font-size="12" fill="#333">Query (o pedido):</text>
  <text x="105" y="216" text-anchor="middle" font-size="12" fill="#333">"procuro contexto</text>
  <text x="105" y="231" text-anchor="middle" font-size="12" fill="#333">de obstáculo"</text>

  <!-- livros -->
  <rect x="340" y="50" width="270" height="70" rx="10" fill="#e8f4f0" stroke="#0F6E56" stroke-width="1.8"/>
  <text x="355" y="72" font-size="12" fill="#333">Key: "sou o marcador &lt;obstacle&gt;"</text>
  <text x="355" y="90" font-size="12" fill="#333">Value: informação de obstáculo</text>
  <text x="355" y="110" font-size="12" font-weight="700" fill="#0F6E56">casa muito → peso ALTO</text>

  <rect x="340" y="145" width="270" height="70" rx="10" fill="#f5f5f4" stroke="#9a9a95" stroke-width="1.2"/>
  <text x="355" y="167" font-size="12" fill="#333">Key: "sou uma vírgula"</text>
  <text x="355" y="185" font-size="12" fill="#333">Value: informação de pontuação</text>
  <text x="355" y="205" font-size="12" font-weight="700" fill="#777">casa pouco → peso baixo</text>

  <rect x="340" y="240" width="270" height="70" rx="10" fill="#f5f5f4" stroke="#9a9a95" stroke-width="1.2"/>
  <text x="355" y="262" font-size="12" fill="#333">Key: "sou um espaço"</text>
  <text x="355" y="280" font-size="12" fill="#333">Value: informação de separação</text>
  <text x="355" y="300" font-size="12" font-weight="700" fill="#777">casa pouco → peso baixo</text>

  <line x1="192" y1="180" x2="336" y2="90"  stroke="#0F6E56" stroke-width="3"   marker-end="url(#aA)"/>
  <line x1="192" y1="195" x2="336" y2="180" stroke="#9a9a95" stroke-width="1.3" marker-end="url(#aB)"/>
  <line x1="192" y1="210" x2="336" y2="275" stroke="#9a9a95" stroke-width="1.3" marker-end="url(#aB)"/>

  <text x="310" y="345" text-anchor="middle" font-size="12" fill="#777">A nova versão do token = mistura dos Values, com mais peso para quem casou melhor.</text>
</svg>
